<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="skulls2" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <rect width="70" height="70" fill="#000000"/>
      <g fill="#7B2FF7">
        <animate attributeName="opacity" values="0.3;0.5;0.25;0.3" dur="3s" repeatCount="indefinite"/>
        <circle cx="35" cy="26" r="13"/>
        <rect x="24" y="35" width="22" height="10" rx="2"/>
        <circle cx="30" cy="24" r="3" fill="#000000"/>
        <circle cx="40" cy="24" r="3" fill="#000000"/>
      </g>
    </pattern>
    <linearGradient id="scanGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip2"><rect width="900" height="110"/></clipPath>
  </defs>

  <g clip-path="url(#clip2)">
    <rect width="900" height="110" fill="url(#skulls2)"/>

    <rect x="0" y="-30" width="900" height="30" fill="url(#scanGrad2)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 140" dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <text x="450" y="62" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
          font-weight="900" font-size="26" fill="#B388FF">
      conexão encerrada_
      <animate attributeName="opacity" values="1;1;0.2;1;1" keyTimes="0;0.7;0.75;0.8;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
