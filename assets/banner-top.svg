<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="skulls" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="90" height="90" fill="#1b0630"/>
      <g fill="#7B2FF7">
        <animate attributeName="fill" values="#7B2FF7;#B388FF;#5A1FB8;#7B2FF7" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.65;0.35;0.45" dur="2.6s" repeatCount="indefinite"/>
        <circle cx="45" cy="34" r="18"/>
        <rect x="30" y="46" width="30" height="14" rx="3"/>
        <circle cx="38" cy="32" r="4" fill="#1b0630"/>
        <circle cx="52" cy="32" r="4" fill="#1b0630"/>
        <rect x="41" y="44" width="8" height="8" fill="#1b0630"/>
        <line x1="33" y1="58" x2="38" y2="66" stroke="#1b0630" stroke-width="2"/>
        <line x1="45" y1="58" x2="45" y2="66" stroke="#1b0630" stroke-width="2"/>
        <line x1="57" y1="58" x2="52" y2="66" stroke="#1b0630" stroke-width="2"/>
      </g>
    </pattern>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B388FF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clip"><rect width="900" height="240"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#skulls)"/>
    <rect width="900" height="240" fill="#000000" opacity="0.2"/>

    <!-- scanline em movimento -->
    <rect x="0" y="-60" width="900" height="60" fill="url(#scanGrad)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 300" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- balão de fala -->
    <g transform="translate(230,60)">
      <path d="M0 40 Q0 0 40 0 L400 0 Q440 0 440 40 L440 90 Q440 130 400 130 L120 130 L70 168 L85 130 L40 130 Q0 130 0 90 Z"
            fill="#ffffff" stroke="#000000" stroke-width="7">
        <animate attributeName="stroke" values="#000000;#7B2FF7;#000000;#000000;#000000" dur="3.5s" repeatCount="indefinite"/>
      </path>
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 1 0; -1 0; 0 0; 0 0; 0 0; 2 0; 0 0" keyTimes="0;0.05;0.1;0.15;0.5;0.55;0.6;1"
          dur="3.5s" repeatCount="indefinite"/>
        <text x="220" y="55" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
              font-weight="900" font-size="32" fill="#000000" letter-spacing="1">OMG!!! IT'S</text>
        <text x="220" y="100" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
              font-weight="900" font-size="38" fill="#7B2FF7" letter-spacing="1">NITR0_ZEUS!</text>
      </g>
    </g>

    <text x="450" y="225" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="16" fill="#B388FF" opacity="0.8">joão oliveira // backend dev</text>
  </g>
</svg>
